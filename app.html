<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Only run code and styles from this site, the spreadsheet library and
       Google Fonts. A safety net in case a shared plan contains anything nasty. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.sheetjs.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Seat Planner</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="Plan your wedding seating: arrange guests around tables with ease.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <!-- Shown instead of the editing controls when opened from a share link -->
  <div class="view-banner" id="viewBanner" hidden>
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>You're viewing a shared seating plan. It's view only.</span>
    <button class="btn small primary" id="saveCopy">Save a copy to edit</button>
    <a class="btn small" href="app.html">Open my planner</a>
  </div>

  <header class="topbar">
    <div class="topbar-main">
      <a class="brand" href="index.html">Seat Planner</a>
      <!-- Three columns with equal sides, so the name itself is exactly centred -->
      <div class="event">
        <span></span>
        <h1 id="eventName" class="event-name" spellcheck="false" title="Click to rename"></h1>
        <div class="event-actions edit-only">
          <button class="icon-btn small event-switch" id="eventSwitch" aria-expanded="false" aria-haspopup="true" title="Your events" aria-label="Your events">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <span class="save-status" id="saveStatus" role="status"></span>
        </div>
        <div class="popover centered" id="eventMenu" hidden></div>
      </div>
      <span class="spacer"></span>
    </div>
    <div class="topbar-side edit-only">
      <button class="icon-btn" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
      </button>
      <button class="icon-btn" id="redo" title="Redo (Ctrl+Y)" aria-label="Redo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>
      </button>
      <button class="btn" id="shareBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
        Share
      </button>
      <div class="menu-anchor">
        <button class="avatar" id="accountBtn" aria-expanded="false" aria-haspopup="true" aria-label="Account"></button>
        <div class="popover right" id="accountMenu" hidden></div>
      </div>
    </div>
  </header>

  <div class="layout">
    <main class="stage">
      <div id="floor" class="floor"><div id="room" class="room"></div></div>

      <div class="floating add-table edit-only">
        <button class="add-table-main" id="addTable" title="Add a table like the last one">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Add table
        </button>
        <button class="choose-shape" id="chooseShape" aria-expanded="false" aria-haspopup="true" title="Choose a shape" aria-label="Choose a shape">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="popover centered" id="shapeMenu" hidden><div class="shape-picker" id="shapePicker"></div></div>
      </div>

      <div class="floating zoom" role="group" aria-label="Zoom">
        <button class="icon-btn" id="zoomOut" title="Zoom out" aria-label="Zoom out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </button>
        <button class="zoom-level" id="zoomReset" title="Reset to 100%">100%</button>
        <button class="icon-btn" id="zoomIn" title="Zoom in" aria-label="Zoom in">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <span class="menu-sep"></span>
        <button class="icon-btn" id="zoomFit" title="Fit all tables on screen" aria-label="Fit all tables on screen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg>
        </button>
      </div>
    </main>

    <aside class="panel" id="panel">
      <div class="stats">
        <div class="stats-top">
          <div class="stats-main">
            <span id="total" class="total-num"></span>
            <span id="totalLabel" class="total-label"></span>
          </div>
          <div class="capacity" id="capacity">
            <span class="capacity-label">Venue capacity</span>
            <button class="capacity-num" id="capacityBtn" title="Click to change the venue capacity"></button>
            <span class="capacity-note" id="capacityNote"></span>
          </div>
        </div>
        <div class="stats-sub">
          <strong id="seated"></strong> seated <span id="unseatedNote" class="unseated-note"></span>
        </div>
        <div class="meter" aria-hidden="true"><span id="meterFill" class="meter-fill"></span></div>
        <div class="stats-actions edit-only">
          <button class="btn small" id="importBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
            Import guest list
          </button>
        </div>
      </div>
      <div id="list"></div>
    </aside>
  </div>
</div>

<div id="card" class="card" role="dialog" aria-label="Guest details" hidden></div>
<div id="picker" class="card picker" role="dialog" aria-label="Add a guest" hidden></div>
<dialog id="dialog" class="dialog"></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="importFile" accept=".xlsx,.xls,.csv,.ods,.numbers" hidden>

<!-- Plain scripts, loaded in order: each file uses what the ones above it define. -->
<script src="js/util.js"></script>
<script src="js/model.js"></script>
<script src="js/geometry.js"></script>
<script src="js/storage.js"></script>
<script src="js/store.js"></script>
<script src="js/viewport.js"></script>
<script src="js/render.js"></script>
<script src="js/interactions.js"></script>
<script src="js/picker.js"></script>
<script src="js/events-ui.js"></script>
<script src="js/import.js"></script>
<script src="js/share.js"></script>
<script src="js/main.js"></script>
</body>
</html>
